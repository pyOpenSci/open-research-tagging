# Fetch PR review comments, rebuild site/data JSON in the runner, deploy Pages.
# Does NOT commit JSON back to main (13c) — avoids bot vs human push races.
# Runs daily and on manual dispatch.

name: Update comment data

on:
  workflow_dispatch:
  schedule:
    # 14:00 UTC daily (~10:00 America/New_York)
    - cron: "0 14 * * *"

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Fetch PR review comments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m open_research_tagging.fetch_comments

      - name: Process comments
        run: python -m open_research_tagging.process_comments

      - name: Emit codebook.json
        run: python -m open_research_tagging.emit_codebook

      - name: Process projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        # Include open-PR project.yaml so new slugs appear before merge (13a).
        run: python -m open_research_tagging.process_projects --include-open-prs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
