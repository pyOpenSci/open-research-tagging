# Starter project.yaml for projects/<slug>/. Do not edit this file by hand —
# use the site coding view (coding.html?project=<slug>), then Copy YAML and
# paste over this file on the PR. See README → How to add a project.

slug: example-project
display_name: Example Project

provenance:
  source_repo: https://github.com/org/repo
  source_commit: REPLACE_WITH_FULL_SHA
  source_url: null
  retrieved_at: YYYY-MM-DD
  notes: ""

files: []

coding:
  stance:
    explicit: null
    implicit: []

  scope:
    explicit:
      code: not-addressed
      tests: not-addressed
      docs_and_text: not-addressed
      issues_and_pr_descriptions: not-addressed
      review: not-addressed
      autonomous_agents: not-addressed
      contribution_types_not_defined: not-addressed
    implicit:
      code: not-seen
      comments: not-seen
      tests: not-seen
      docs_and_text: not-seen
      issues_and_pr_descriptions: not-seen
      review: not-seen
      autonomous_agents: not-seen

  stated_rationale:
    explicit: []
    implicit: []

  guidance_on_use:
    explicit:
      level: null
      types: []
    implicit:
      level: null
      types: []
      notes: ""
      written_for: ""
      not_ai_specific: ""

  accountability:
    explicit:
      human_responsibility: not-stated
      disclosure: none
      disclosure_format: []
      enforcement: []
      new_contributors: not-stated
    implicit:
      disclosure_in_practice: none-seen
      notes: ""

  context:
    explicit:
      project_size: ""
      governance: null
      decision_process: ""
      domain: ""
      policy_date: ""
      policy_location: null
      notes: ""
    implicit:
      contributors: ""
      who_decides: ""
      outside_activity: ""
      when_ai_began: ""
      ai_file_locations: ""
      notes: ""
